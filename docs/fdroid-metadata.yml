# Draft F-Droid build metadata for Kasette.
#
# This is NOT consumed by anything in this repo. F-Droid builds apps from a
# metadata file that lives in their own metadata repo (fdroiddata), not in
# the app's repo. To submit Kasette:
#
#   1. Fork https://gitlab.com/fdroid/fdroiddata
#   2. Add this content as metadata/com.kasette.app.yml in that fork
#      (update CurrentVersionCode/CurrentVersion to match the latest tag,
#      and the commit field under Builds to the tag you want F-Droid to
#      build first, e.g. v1.2.0)
#   3. Open a merge request. F-Droid's build server clones the tag and runs
#      the commands below itself, then signs the resulting APK with their
#      own key, so our own release-signing keystore/secrets are irrelevant
#      to this build.
#   4. Wait for volunteer review (this can take weeks; see
#      https://f-droid.org/docs/Submitting_to_F-Droid_Quick_Start_Guide/).
#
# Requirements this app already satisfies for F-Droid inclusion:
#   - Fully open source, BSD-3-Clause.
#   - No proprietary dependencies, trackers, or ads (Capacitor/AndroidX are
#     all open source).
#   - No network access requested; 100% local.
#   - `android/app/build.gradle`'s signingConfig only applies if a keystore
#     file is present, so `./gradlew assembleRelease` produces a valid
#     unsigned APK when the signing secrets aren't available, exactly what
#     F-Droid's build server needs.

Categories:
  - Multimedia
License: BSD-3-Clause
SourceCode: https://github.com/nico-alvz/kasette
IssueTracker: https://github.com/nico-alvz/kasette/issues
Changelog: https://github.com/nico-alvz/kasette/blob/main/CHANGELOG.md

AutoName: Kasette
Summary: 100% offline, local music player
Description: |
    Kasette plays the music files already on your device. Import them once
    and everything else (tags, cover art, playlists, playback) happens
    locally, with no backend involved.

    Features:

    * Import local audio files (mp3, flac, m4a, ogg, opus, wav, aac)
    * Client-side ID3/FLAC tag and embedded cover art parsing, no dependencies
    * Playlists
    * Light theme by default, with a dark mode and multiple accent colors
    * Export/restore your whole library as a single backup file
    * Background playback with lock screen and notification controls
    * English and Latin American Spanish

    100% local. No accounts, no servers, no analytics, no network requests.

RepoType: git
Repo: https://github.com/nico-alvz/kasette.git

Builds:
  - versionName: "1.2.1"
    versionCode: 7
    commit: v1.2.1
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y npm openjdk-21-jdk-headless
      - update-alternatives --auto java
    init:
      - cd ../..
      - npm ci
      - npx cap sync android
    gradle:
      - yes
    scandelete:
      - node_modules

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: "1.2.1"
CurrentVersionCode: 7
