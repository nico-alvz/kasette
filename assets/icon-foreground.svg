<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Retro compact-cassette tape, flat/geometric, Material-You adaptive-icon
       style. Shapes sit inside the 176..848 safe box (inner 66% of 1024) so
       they survive an adaptive icon's circle/squircle mask. Flat fills only
       (no gradients): the target rasterizer here has no gradient support. -->

  <!-- cassette shell -->
  <rect x="200" y="270" width="624" height="460" rx="44" fill="#15151f"/>

  <!-- tape window slot between the reels -->
  <rect x="300" y="372" width="424" height="34" rx="17" fill="#0a0a12"/>

  <!-- reel windows (ring drawn as two flat fills, not a stroke — the target
       rasterizer here doesn't render fill:none + stroke reliably) -->
  <circle cx="360" cy="389" r="96" fill="#ff5500"/>
  <circle cx="360" cy="389" r="86" fill="#0a0a12"/>
  <circle cx="664" cy="389" r="96" fill="#ff5500"/>
  <circle cx="664" cy="389" r="86" fill="#0a0a12"/>

  <!-- reel hubs -->
  <circle cx="360" cy="389" r="34" fill="#ff5500"/>
  <circle cx="360" cy="389" r="12" fill="#0a0a12"/>
  <circle cx="664" cy="389" r="34" fill="#ff5500"/>
  <circle cx="664" cy="389" r="12" fill="#0a0a12"/>

  <!-- label -->
  <rect x="268" y="560" width="488" height="130" rx="14" fill="#ff5500"/>
  <rect x="276" y="568" width="472" height="114" rx="10" fill="#0a0a12"/>
  <rect x="308" y="600" width="220" height="18" rx="9" fill="rgba(255,255,255,0.5)"/>
  <rect x="308" y="636" width="150" height="18" rx="9" fill="rgba(255,255,255,0.3)"/>

  <!-- screw posts -->
  <circle cx="234" cy="690" r="14" fill="rgba(255,255,255,0.18)"/>
  <circle cx="790" cy="690" r="14" fill="rgba(255,255,255,0.18)"/>
</svg>
