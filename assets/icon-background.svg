<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Flat-shape stand-in for a radial gradient (concentric layers, lightest
       near the top) — the target rasterizer here has no gradient support, so
       true <radialGradient> fills render solid black. Reuses the app's dark
       palette: #322c5c -> #1b1836 -> #131120. -->
  <rect width="1024" height="1024" fill="#131120"/>
  <ellipse cx="512" cy="360" rx="760" ry="620" fill="#1b1836"/>
  <ellipse cx="512" cy="230" rx="480" ry="380" fill="#322c5c"/>
</svg>
