<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Combined flat icon (background + foreground), rounded-rect masked.
       No gradients, no strokes: flat/layered shapes only (see
       icon-background.svg and icon-foreground.svg for why). -->
  <defs>
    <clipPath id="mask">
      <rect width="1024" height="1024" rx="232"/>
    </clipPath>
  </defs>

  <g clip-path="url(#mask)">
    <rect width="1024" height="1024" fill="#131120"/>
    <ellipse cx="512" cy="360" rx="760" ry="620" fill="#1b1836"/>
    <ellipse cx="512" cy="230" rx="480" ry="380" fill="#322c5c"/>

    <!-- shell -->
    <rect x="200" y="260" width="624" height="480" rx="44" fill="#18181f"/>

    <!-- bottom mechanism trapezoid -->
    <polygon points="350,690 674,690 744,760 280,760" fill="#2c2c34"/>
    <circle cx="380" cy="725" r="20" fill="#0a0a0a"/>
    <rect x="460" y="705" width="40" height="40" rx="8" fill="#0a0a0a"/>
    <circle cx="512" cy="725" r="17" fill="#585d66"/>
    <circle cx="512" cy="725" r="6" fill="#0a0a0a"/>
    <rect x="524" y="705" width="40" height="40" rx="8" fill="#0a0a0a"/>
    <circle cx="644" cy="725" r="20" fill="#0a0a0a"/>

    <!-- lower shell corner screws -->
    <circle cx="250" cy="690" r="24" fill="#0a0a0a"/>
    <circle cx="250" cy="690" r="15" fill="#585d66"/>
    <circle cx="774" cy="690" r="24" fill="#0a0a0a"/>
    <circle cx="774" cy="690" r="15" fill="#585d66"/>

    <!-- label -->
    <rect x="228" y="284" width="568" height="392" rx="20" fill="#f3e4c8"/>

    <!-- color stripe band -->
    <rect x="228" y="330" width="568" height="26" fill="#e0483f"/>
    <rect x="228" y="356" width="568" height="26" fill="#eba93a"/>
    <rect x="228" y="382" width="568" height="26" fill="#b8d24a"/>
    <rect x="228" y="408" width="568" height="26" fill="#3ec6c1"/>

    <!-- reel housing (sits on top of the stripe band) -->
    <rect x="300" y="322" width="424" height="176" rx="42" fill="#121018"/>

    <!-- tape window between the reels -->
    <rect x="462" y="392" width="100" height="36" rx="10" fill="#3a2a1e"/>
    <rect x="500" y="392" width="24" height="36" fill="#f3e4c8"/>

    <!-- left reel -->
    <circle cx="412" cy="410" r="64" fill="#aeb4bd"/>
    <circle cx="412" cy="410" r="50" fill="#121018"/>
    <circle cx="412" cy="410" r="34" fill="#aeb4bd"/>
    <circle cx="412" cy="410" r="12" fill="#121018"/>
    <rect x="404" y="336" width="16" height="22" rx="4" fill="#aeb4bd"/>
    <rect x="404" y="462" width="16" height="22" rx="4" fill="#aeb4bd"/>
    <rect x="338" y="402" width="22" height="16" rx="4" fill="#aeb4bd"/>
    <rect x="464" y="402" width="22" height="16" rx="4" fill="#aeb4bd"/>

    <!-- right reel -->
    <circle cx="612" cy="410" r="64" fill="#aeb4bd"/>
    <circle cx="612" cy="410" r="50" fill="#121018"/>
    <circle cx="612" cy="410" r="34" fill="#aeb4bd"/>
    <circle cx="612" cy="410" r="12" fill="#121018"/>
    <rect x="604" y="336" width="16" height="22" rx="4" fill="#aeb4bd"/>
    <rect x="604" y="462" width="16" height="22" rx="4" fill="#aeb4bd"/>
    <rect x="538" y="402" width="22" height="16" rx="4" fill="#aeb4bd"/>
    <rect x="664" y="402" width="22" height="16" rx="4" fill="#aeb4bd"/>

    <!-- index lines -->
    <rect x="260" y="588" width="504" height="10" rx="5" fill="#c9b896"/>
    <rect x="260" y="618" width="504" height="10" rx="5" fill="#c9b896"/>

    <!-- upper shell corner screws -->
    <circle cx="250" cy="310" r="24" fill="#0a0a0a"/>
    <circle cx="250" cy="310" r="15" fill="#585d66"/>
    <circle cx="774" cy="310" r="24" fill="#0a0a0a"/>
    <circle cx="774" cy="310" r="15" fill="#585d66"/>
  </g>
</svg>
